# ===============================================================
# = SERVER CONFIGURATION
# = 기본 서버 설정
# ===============================================================
# Spring Boot 애플리케이션의 이름을 지정합니다.
spring.application.name=demo
# 내장 웹 서버(Tomcat)가 사용할 포트를 지정합니다.
# Keycloak이 기본적으로 8080 포트를 사용하므로, 충돌을 피하기 위해 8081로 설정합니다.
server.port=8081


# ===============================================================
# = SPRING SECURITY & KEYCLOAK ADAPTER
# = Spring Security와 Keycloak 연동 설정 (사용자 인증용)
# ===============================================================
# Keycloak이 발행하는 JWT 토큰의 발급자(issuer) URI를 지정합니다.
# Spring Security는 이 URI를 통해 토큰의 유효성을 검증하는 데 필요한 공개 키 등을 가져옵니다.
# 형식: {Keycloak 서버 주소}/realms/{Realm 이름}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/demo


# ===============================================================
# = KEYCLOAK ADMIN CLIENT CONFIGURATION
# = Keycloak Admin API 연동 설정 (회원 탈퇴 등 관리 기능용)
# ===============================================================
# Keycloak 서버의 주소를 지정합니다.
keycloak.admin.server-url=http://localhost:8080
# Admin API를 호출할 때 사용할 Realm을 지정합니다.
# 특정 Realm의 사용자를 관리하려면 해당 Realm 이름을 사용합니다.
keycloak.admin.realm=demo
# Admin API 접근 권한이 부여된 클라이언트의 ID를 지정합니다. (예: backend-client)
keycloak.admin.client-id=backend-client
# 위 클라이언트의 Secret 값을 지정합니다. Keycloak 관리자 콘솔에서 발급받은 값을 입력해야 합니다.
# [중요] 이 값은 외부에 노출되어서는 안 됩니다.
keycloak.admin.client-secret=your-admin-client-secret


# ===============================================================
# = DATABASE & JPA (Optional)
# = 데이터베이스 및 JPA 설정 (이 프로젝트에서는 직접 사용하지 않음)
# ===============================================================
# 이 프로젝트는 Keycloak을 통해 사용자를 관리하므로, 백엔드 자체에 데이터베이스 연결이 필수는 아닙니다.
# 만약 애플리케이션에 별도의 데이터가 필요하다면 아래 주석을 해제하고 설정하세요.
# spring.datasource.url=jdbc:postgresql://localhost:4532/mydatabase
# spring.datasource.username=myuser
# spring.datasource.password=mypassword
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.show-sql=true
